<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: system-ui; padding: 16px; width: 220px; text-align: center; }
    button { padding: 10px; width: 100%; margin-top: 8px; cursor: pointer; border-radius: 6px; border: 1px solid #ccc; background: #fff;}
    button:disabled { cursor: wait; opacity: 0.6; }
    #startBtn { background: #000; color: #fff; border: none; }
    #status { margin-top: 12px; font-size: 12px; color: #666; line-height: 1.4; }
    #status[data-tone="error"] { color: #b42318; }
  </style>
</head>
<body>
  <h3>VidyaPulse AI</h3>
  <button id="startBtn">Start Capture</button>
  <button id="stopBtn" style="display: none">Stop Capture</button>
  <button id="openBtn" style="display: none">Open in VidyaPulse</button>
  <div id="status" role="status">Status: Idle</div>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
